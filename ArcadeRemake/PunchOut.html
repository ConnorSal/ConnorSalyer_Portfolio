<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punch-Out!!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="project-page punchout-page">

<div class="crt-overlay"></div>

<header>
    <h1>Punch-Out!!</h1>
</header>

<div class="game-container play">
    <div class="game-frame" style="max-width:734px">
        <canvas id="game" width="734" height="561"></canvas>
        <div class="game-overlay hidden" id="overlay">
            <h2 class="overlay-title"></h2>
            <p class="overlay-text"></p>
            <button class="overlay-btn" type="button"></button>
        </div>
    </div>
    <div class="game-hud" id="hud"></div>
    <p class="controls">← → punch · ↓ block</p>

    <p class="desc">Retro boxing game based on the NES classic, first written in C# WinForms and now playable in the browser. Attack and block against Tough Rob, a CPU opponent who weaves and swings on a timer.</p>

    <p class="back-link-wrap">
        <a href="arcadeIndex.html" class="back-link">Back to projects</a>
    </p>
</div>

<script src="js/arcade.js"></script>
<script src="js/punchout.js"></script>
</body>
</html>
