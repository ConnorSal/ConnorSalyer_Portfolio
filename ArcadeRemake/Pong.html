<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="project-page pong-page">

<div class="crt-overlay"></div>

<header>
    <h1>Pong</h1>
</header>

<div class="game-container play">
    <div class="game-frame" style="max-width:800px">
        <canvas id="game" width="800" height="450"></canvas>
        <div class="game-overlay hidden" id="overlay">
            <h2 class="overlay-title"></h2>
            <p class="overlay-text"></p>
            <button class="overlay-btn" type="button"></button>
        </div>
    </div>
    <div class="game-hud" id="hud"></div>
    <p class="controls">↑ ↓ move</p>

    <p class="desc">Classic Pong rebuilt in C# using WinForms, now ported to JavaScript so it runs right here. This was my first game built in WinForms; it taught me about picture boxes and driving them from code. Much easier than a console app!</p>

    <p class="back-link-wrap">
        <a href="arcadeIndex.html" class="back-link">Back to projects</a>
    </p>
</div>

<script src="js/arcade.js"></script>
<script src="js/pong.js"></script>
</body>
</html>
